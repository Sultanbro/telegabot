name: telegram-checks
services:
  tests:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    environment:
      APP_ENV: testing
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: 'false'
